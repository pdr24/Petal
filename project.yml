name: Petal
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Petal:
    type: application
    platform: macOS
    sources:
      - path: Petal
    settings:
      base:
        PRODUCT_NAME: Petal
        PRODUCT_BUNDLE_IDENTIFIER: com.local.petal
        INFOPLIST_FILE: Petal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Petal/Petal.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
  PetalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PetalTests
    dependencies:
      - target: Petal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.petal.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Petal.app/Contents/MacOS/Petal"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
schemes:
  Petal:
    build:
      targets:
        Petal: all
        PetalTests: [test]
    test:
      targets:
        - PetalTests
